<style>
    :root {
        --bg: #171918;
        --card-bg: #1e211f;
        --card-bg-light: #232724;

        --accent: #9caf9f;
        --accent-soft: rgba(156, 175, 159, 0.10);

        --text: #ecece7;
        --text-dim: #a8aaa5;

        --border: #343834;

        --max-width: 1200px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        background: var(--bg);
        color: var(--text);

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Helvetica,
            Arial,
            sans-serif;

        line-height: 1.65;
        overflow-x: hidden;
    }

    /* Decorative blob no longer needed */
    .blob {
        display: none;
    }


    /* =============================
       NAVIGATION
    ============================= */

    nav {
        padding: 1.2rem 7%;

        display: flex;
        justify-content: space-between;
        align-items: center;

        position: sticky;
        top: 0;
        z-index: 100;

        background: rgba(23, 25, 24, 0.94);
        border-bottom: 1px solid var(--border);

        backdrop-filter: blur(8px);
    }

    .logo {
        font-weight: 600;
        font-size: 1rem;

        letter-spacing: 0;
    }

    .logo span {
        color: var(--accent);
    }


    /* =============================
       HERO
    ============================= */

    header {
        padding: 110px 10% 90px;

        max-width: 1350px;
        margin: auto;
    }

    .badge {
        display: inline-block;

        padding: 0;
        margin-bottom: 1.4rem;

        background: none;
        border: none;

        color: var(--accent);

        font-size: 0.78rem;
        font-weight: 500;

        letter-spacing: 0.06em;
        text-transform: uppercase;
    }

    h1 {
        font-size: clamp(2.9rem, 7vw, 5.2rem);

        line-height: 1.05;
        letter-spacing: -0.045em;

        font-weight: 500;

        margin-bottom: 1.8rem;

        max-width: 1000px;
    }

    .accent {
        color: var(--accent);
    }

    .hero-p {
        font-size: 1.12rem;

        line-height: 1.75;

        color: var(--text-dim);

        max-width: 800px;

        margin-bottom: 2rem;
    }


    /* =============================
       KEYWORDS
    ============================= */

    .hero-keywords {
        display: flex;
        flex-wrap: wrap;

        gap: 0.55rem;

        margin-bottom: 2.4rem;
    }

    .hero-keywords span {
        padding: 0.3rem 0.6rem;

        border: 1px solid var(--border);
        border-radius: 4px;

        background: transparent;

        color: var(--text-dim);

        font-size: 0.78rem;
    }


    /* =============================
       BUTTONS
    ============================= */

    .btn-group {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
    }

    .btn {
        padding: 0.72rem 1.2rem;

        border-radius: 4px;

        text-decoration: none;

        font-size: 0.86rem;
        font-weight: 500;

        transition:
            background 0.15s ease,
            color 0.15s ease,
            border-color 0.15s ease;
    }

    .btn-primary {
        background: var(--text);
        color: var(--bg);

        border: 1px solid var(--text);
    }

    .btn-primary:hover {
        background: #ffffff;
    }

    .btn-secondary {
        background: transparent;

        border: 1px solid var(--border);

        color: var(--text);
    }

    .btn-secondary:hover {
        border-color: #60655f;
        background: rgba(255, 255, 255, 0.025);
    }


    /* =============================
       SECTION TITLES
    ============================= */

    .section-title {
        padding: 0 10%;

        max-width: 1400px;

        margin: 0 auto 2rem;

        font-size: 1.65rem;

        font-weight: 500;
        letter-spacing: -0.02em;
    }

    .section-title span {
        color: var(--accent);
    }


    /* =============================
       EXPERIENCE GRID
    ============================= */

    .grid-container {
        padding: 0 10% 100px;

        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 1rem;

        max-width: 1400px;

        margin: 0 auto;
    }

    .bento-item {
        background: var(--card-bg);

        border: 1px solid var(--border);

        border-radius: 8px;

        padding: 1.8rem;

        display: flex;
        flex-direction: column;

        transition:
            border-color 0.15s ease,
            background 0.15s ease;
    }

    .bento-item:hover {
        border-color: #505650;

        background: var(--card-bg-light);

        transform: none;
        box-shadow: none;
    }

    .col-2 {
        grid-column: span 2;
    }

    .experience-label {
        color: var(--accent);

        font-size: 0.71rem;

        text-transform: uppercase;

        letter-spacing: 0.07em;

        font-weight: 500;

        margin-bottom: 0.7rem;
    }

    h3 {
        margin-bottom: 0.9rem;

        font-size: 1.16rem;

        font-weight: 500;
        letter-spacing: -0.01em;
    }

    .bento-item p {
        color: var(--text-dim);

        font-size: 0.92rem;

        line-height: 1.7;

        flex-grow: 1;

        margin-bottom: 1.4rem;
    }


    /* =============================
       TAGS
    ============================= */

    .tag-list {
        display: flex;
        flex-wrap: wrap;

        gap: 0.45rem;
    }

    .tag-small {
        padding: 3px 7px;

        border: 1px solid var(--border);
        border-radius: 3px;

        background: transparent;

        color: #b9bbb6;

        font-size: 0.72rem;

        display: inline-flex;
        align-items: center;

        gap: 5px;
    }


    /* =============================
       TIMELINE
    ============================= */

    .timeline-section {
        padding: 20px 10% 100px;

        max-width: 1150px;

        margin: 0 auto;
    }

    .timeline {
        border-left: 1px solid var(--border);

        padding-left: 2rem;
    }

    .timeline-item {
        position: relative;

        margin-bottom: 2.8rem;
    }

    .timeline-item::before {
        content: "";

        position: absolute;

        left: -2.34rem;
        top: 0.45rem;

        width: 9px;
        height: 9px;

        border-radius: 50%;

        background: var(--bg);

        border: 1px solid var(--accent);
    }

    .timeline-date {
        color: var(--accent);

        font-size: 0.78rem;

        font-weight: 500;

        margin-bottom: 0.35rem;
    }

    .timeline-title {
        font-size: 1.08rem;

        font-weight: 500;

        margin-bottom: 0.4rem;
    }

    .timeline-text {
        color: var(--text-dim);

        font-size: 0.9rem;

        max-width: 800px;

        line-height: 1.7;
    }


    /* =============================
       SKILLS
    ============================= */

    .skills-section {
        padding: 80px 10%;

        background: #1a1d1b;

        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
    }

    .skills-grid {
        max-width: 1250px;

        margin: auto;

        display: grid;

        grid-template-columns:
            repeat(auto-fit, minmax(220px, 1fr));

        gap: 3rem;
    }

    .skill-category h4 {
        margin-bottom: 1.2rem;

        padding-bottom: 0.65rem;

        border-bottom: 1px solid var(--border);

        font-size: 0.92rem;

        font-weight: 500;
    }

    .skill-list {
        list-style: none;
    }

    .skill-list li {
        margin-bottom: 0.7rem;

        color: var(--text-dim);

        font-size: 0.88rem;

        display: flex;
        align-items: center;

        gap: 9px;
    }

    .skill-icon {
        min-width: 20px;

        color: var(--accent);

        font-size: 1rem;
    }


    /* =============================
       FOOTER
    ============================= */

    footer {
        padding: 3.5rem 10%;

        text-align: center;

        background: var(--bg);

        color: #7f827e;

        font-size: 0.82rem;
    }


    /* =============================
       ANIMATION
    ============================= */

    .reveal {
        opacity: 1;
        transform: none;
    }


    /* =============================
       MOBILE
    ============================= */

    @media (max-width: 1000px) {

        .grid-container {
            grid-template-columns:
                repeat(2, 1fr);
        }
    }


    @media (max-width: 768px) {

        header {
            padding:
                80px 8% 65px;
        }

        .grid-container {
            padding-left: 8%;
            padding-right: 8%;

            grid-template-columns: 1fr;
        }

        .section-title,
        .timeline-section,
        .skills-section {
            padding-left: 8%;
            padding-right: 8%;
        }

        .col-2 {
            grid-column: span 1;
        }

        h1 {
            font-size: 2.8rem;
        }
    }
</style>
